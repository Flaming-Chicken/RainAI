name = "rainai"
pages_build_output_dir = "crates/web/dist"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

# Unified R2 Bucket for accepting end-user data (Used by both staging and prod)
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "rainai-submissions"

# Unified D1 Database for metadata management (Used by both staging and prod)
[[d1_databases]]
binding = "DB"
database_name = "rainai-db"
database_id = "prod-db-uuid-placeholder"

[vars]
ENVIRONMENT = "production"
NODE_VERSION = "24"
