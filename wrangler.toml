name = "rainai"
main = "crates/web/worker.js"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "crates/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "rainai.spodeian.trade"
custom_domain = true

[[routes]]
pattern = "rain-ai.spodeian.trade"
custom_domain = true

# Unified R2 Bucket for accepting end-user data (Used by both dev/staging and prod)
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "rainai-submissions"

# Unified D1 Database for metadata management (Used by both dev/staging and prod)
[[d1_databases]]
binding = "DB"
database_name = "rainai-db"
database_id = "4480b6da-9e49-4b2b-a739-a9fd33e7f075"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[vars]
ENVIRONMENT = "production"
