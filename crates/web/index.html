<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RainAI · Neural Spatial Soundscape Studio</title>

    <!-- Primary SEO Metadata -->
    <meta name="title" content="RainAI · Neural Spatial Soundscape Studio">
    <meta name="description" content="Production-ready Neural Spatial Rain Audio Synthesis in Rust, WebGPU, and WebAssembly.">
    <meta name="keywords" content="rust, wasm, egui, eframe, spatial audio, ambisonics, hrtf, neural synthesis, webgpu">
    <meta name="author" content="Liam">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook Social Metadata -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RainAI · Neural Spatial Soundscape Studio">
    <meta property="og:description" content="Continuous procedural neural rain synthesis conditioned on 554 physical parameters.">

    <!-- Twitter Social Metadata -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="RainAI · Neural Spatial Soundscape Studio">
    <meta property="twitter:description" content="Continuous procedural neural rain synthesis conditioned on 554 physical parameters.">

    <!-- Progressive Web App & Offline Capabilities -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Trunk Rust WebAssembly link & Offline assets -->
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-type="main"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-simd --enable-bulk-memory --enable-mutable-globals --enable-nontrapping-float-to-int --enable-sign-ext --converge --directize --duplicate-function-elimination --coalesce-locals --vacuum --strip-debug --strip-producers"
      data-integrity="none"
    >
    <link data-trunk rel="copy-file" href="_headers">
    <link data-trunk rel="copy-file" href="_redirects">
    <link data-trunk rel="copy-file" href="sw.js">
    <link data-trunk rel="copy-file" href="manifest.json">
    <link data-trunk rel="copy-file" href="../../Data/rain/attributions.bin">
    <link data-trunk rel="copy-file" href="_worker.js">

    <!-- Direct Trunk asset fetching from inference crate data (single source of truth) -->
    <link data-trunk rel="copy-dir" href="../inference/data/candle" data-target-path="models">
    <link data-trunk rel="copy-dir" href="../inference/data/onnx" data-target-path="models/onnx">
    <link data-trunk rel="copy-dir" href="../inference/data/wasm" data-target-path="data">
    <link data-trunk rel="copy-file" href="../inference/data/rainai_deployment_config.json" data-target-path="data">
    <link data-trunk rel="copy-dir" href="../inference/src/shaders" data-target-path="shaders">

    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

    <!-- CSS and JavaScript Assets Managed by Trunk -->
    <link data-trunk rel="scss" href="index.scss" data-integrity="none">
    <script data-trunk rel="inline" src="index.js" defer data-integrity="none"></script>
  </head>
  <body>
    <!-- Transparent Studio Loading Skeleton & ETA Progress Bar -->
    <div id="loading_overlay" class="loading_overlay">
      <!-- Simulated Studio Navbar Skeleton -->
      <header class="skeleton_navbar">
        <div class="skeleton_brand">
          <div class="skeleton_icon"></div>
          <div class="skeleton_title"></div>
        </div>
        <div class="skeleton_nav_buttons">
          <div class="skeleton_btn"></div>
          <div class="skeleton_btn"></div>
          <div class="skeleton_btn"></div>
        </div>
      </header>

      <!-- Simulated Studio Soundstage Layout Skeleton -->
      <main class="skeleton_studio">
        <div class="skeleton_panel skeleton_visualizer">
          <div class="skeleton_radar_circle"></div>
          <div class="skeleton_radar_wave"></div>
        </div>
        <div class="skeleton_panel skeleton_controls">
          <div class="skeleton_slider_row"></div>
          <div class="skeleton_slider_row"></div>
          <div class="skeleton_slider_row"></div>
          <div class="skeleton_slider_row"></div>
        </div>
      </main>

      <!-- Center Dynamic Progress & Hardware Card -->
      <div class="loading_center_card">
        <div class="loading_title_row">
          <span class="pulse_dot"></span>
          <h2>Initializing Neural Audio Engine</h2>
        </div>
        <div class="hw_badge_row">
          <span id="hw_badge" class="badge">Detecting Acceleration...</span>
        </div>

        <div class="progress_container">
          <div class="progress_track">
            <div id="progress_fill" class="progress_fill"></div>
          </div>
          <div class="progress_status">
            <span id="progress_step">Downloading Neural Weights...</span>
            <span id="progress_pct">0%</span>
          </div>
          <div class="progress_metrics">
            <span id="progress_bytes">0.0 MB / ~14.8 MB</span>
            <span id="progress_speed">Speed: -- MB/s</span>
            <span id="progress_eta">ETA: Calculating...</span>
          </div>
        </div>

        <div id="recovery_banner" class="recovery_banner hidden"></div>
      </div>
    </div>

    <!-- Hidden Cloudflare Turnstile Verification Target -->
    <div id="cf-turnstile-container" class="turnstile_hidden" style="display:none;"></div>

    <canvas id="egui_canvas"></canvas>
  </body>
</html>
