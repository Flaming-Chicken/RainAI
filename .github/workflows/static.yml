# Simple workflow for deploying compiled Rust/WASM content to GitHub Pages and Cloudflare Workers
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure Private Git Auth (Optional)
        env:
          SPODEIAN_GIT_TOKEN: ${{ secrets.SPODEIAN_CORE_TOKEN || secrets.PRIVATE_READ_ACCESS || secrets.GH_PAT }}
        run: |
          if [ -n "$SPODEIAN_GIT_TOKEN" ]; then
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
            git config --global url."https://x-access-token:${SPODEIAN_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache Trunk Binary
        id: cache-trunk
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/trunk
          key: ${{ runner.os }}-trunk-latest

      - name: Install Trunk Asset Bundler
        if: steps.cache-trunk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cargo/bin
          wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C ~/.cargo/bin
          chmod +x ~/.cargo/bin/trunk

      - name: Cache wasm-opt Binary (Binaryen)
        id: cache-wasm-opt
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-opt
          key: ${{ runner.os }}-wasm-opt-version_132

      - name: Install Binaryen wasm-opt (v132)
        if: steps.cache-wasm-opt.outputs.cache-hit != 'true'
        run: |
          BINARYEN_VERSION="version_132"
          mkdir -p ~/.cargo/bin
          wget -qO- "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar -xzf -
          mv "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" ~/.cargo/bin/wasm-opt
          chmod +x ~/.cargo/bin/wasm-opt
          rm -rf "binaryen-${BINARYEN_VERSION}"

      - name: Add Cargo Bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Web Application & Sync Static Assets
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: |
          echo "Active wasm-opt version: $(wasm-opt --version)"
          mkdir -p crates/inference/data/wasm
          trunk build --release --public-url "/"
          for wasm_file in crates/web/dist/*.wasm; do
            if [ -f "$wasm_file" ]; then
              echo "Optimizing $wasm_file with wasm-opt (SIMD enabled)"
              wasm-opt -Oz --enable-simd "$wasm_file" -o "$wasm_file" || true
            fi
          done
          mkdir -p crates/web/dist/models crates/web/dist/shaders crates/web/dist/data
          cp -f crates/inference/data/wasm/*.bin crates/web/dist/models/ 2>/dev/null || true
          cp -f crates/inference/data/rainai_deployment_config.json crates/web/dist/data/rainai_deployment_config.json 2>/dev/null || true
          cp -f crates/inference/src/shaders/*.wgsl crates/web/dist/shaders/ 2>/dev/null || true
          cp -f data/rain/attributions.bin crates/web/dist/attributions.bin 2>/dev/null || true
          cp -f crates/web/_headers crates/web/dist/_headers 2>/dev/null || true
          cp -f crates/web/_redirects crates/web/dist/_redirects 2>/dev/null || true
          rm -f crates/web/dist/_worker.js crates/web/dist/_routes.json

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Minify Production Assets (HTML, CSS, JS)
        run: |
          echo "=== Minifying Production Distribution Assets in crates/web/dist ==="
          if [ -d "crates/web/dist" ]; then
            for js_file in crates/web/dist/*.js; do
              if [ -f "$js_file" ]; then
                echo "Minifying JS: $js_file"
                npx --yes esbuild "$js_file" --minify --allow-overwrite --outfile="$js_file"
              fi
            done
            for css_file in crates/web/dist/*.css; do
              if [ -f "$css_file" ]; then
                echo "Minifying CSS: $css_file"
                npx --yes esbuild "$css_file" --minify --allow-overwrite --outfile="$css_file"
              fi
            done
            if [ -f "crates/web/dist/index.html" ]; then
              echo "Minifying HTML: crates/web/dist/index.html"
              npx --yes html-minifier-terser --collapse-whitespace --remove-comments --remove-redundant-attributes --remove-script-type-attributes --remove-style-link-type-attributes --use-short-doctype --minify-css true --minify-js true -o crates/web/dist/index.html crates/web/dist/index.html
            fi
          fi

      - name: Setup Pages
        id: setup-pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Upload compiled assets artifact (Pages)
        if: steps.setup-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'crates/web/dist'

      - name: Upload compiled assets artifact (Fallback for Private Repo)
        if: steps.setup-pages.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: 'crates/web/dist'
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: steps.setup-pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deploy to Cloudflare Workers
        if: github.repository_owner == 'Spodeian' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
